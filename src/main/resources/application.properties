server.port=8080

# 后台评估周期（秒）；<=0 时仅在上报后/手动触发时评估
pipeline.observability.evaluation-interval-seconds=30
# 每条流水线保留的历史评估结论与已恢复告警条数（保证存储/查询开销有界）
pipeline.observability.evaluation-history-limit=200
pipeline.observability.recovered-alert-limit=100

# 示例流水线 orders-hourly：10 分钟评估窗口，迟到事件 24 小时内可追溯
pipeline.observability.pipelines[0].id=orders-hourly
pipeline.observability.pipelines[0].display-name=订单小时级流水线
pipeline.observability.pipelines[0].window-seconds=600
pipeline.observability.pipelines[0].retention-seconds=86400
pipeline.observability.pipelines[0].future-tolerance-seconds=60
pipeline.observability.pipelines[0].thresholds.max-freshness-seconds=300
pipeline.observability.pipelines[0].thresholds.max-schedule-delay-seconds=120
pipeline.observability.pipelines[0].thresholds.max-failure-rate-percent=0
pipeline.observability.pipelines[0].thresholds.escalation-delay-seconds=600
pipeline.observability.pipelines[0].thresholds.recovery-delay-seconds=120

# 示例流水线 payments-5min：更严格
pipeline.observability.pipelines[1].id=payments-5min
pipeline.observability.pipelines[1].display-name=支付五分钟流水线
pipeline.observability.pipelines[1].window-seconds=300
pipeline.observability.pipelines[1].retention-seconds=3600
pipeline.observability.pipelines[1].future-tolerance-seconds=30
pipeline.observability.pipelines[1].thresholds.max-freshness-seconds=180
pipeline.observability.pipelines[1].thresholds.max-schedule-delay-seconds=60
pipeline.observability.pipelines[1].thresholds.max-failure-rate-percent=0
pipeline.observability.pipelines[1].thresholds.escalation-delay-seconds=300
pipeline.observability.pipelines[1].thresholds.recovery-delay-seconds=60
