server.port=8080

# SLA 默认规则（可按流水线覆盖，如 sla.pipelines.orders.window=PT30M）
sla.default-rule.window=PT1H
sla.default-rule.max-freshness-lag=PT30M
sla.default-rule.max-schedule-delay=PT10M
sla.default-rule.min-sla-attainment=0.9
sla.default-rule.recovery-margin=0.05
sla.default-rule.escalate-after=3
sla.retention=PT2H
sla.require-registered-pipelines=false
